[project]
name = "morning-coach-backend"
version = "0.1.0"
description = "FastAPI backend for the Morning Coach Personal Journal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "tinydb>=4.8.2",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17.1",
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["tinydb", "tinydb.*"]
ignore_missing_imports = true
