services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    restart: unless-stopped
