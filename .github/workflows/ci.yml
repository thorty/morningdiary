name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --dev
        working-directory: backend

      - name: Lint
        run: uv run --frozen ruff check . ../.github/scripts/audit_python.py
        working-directory: backend

      - name: Type check
        run: uv run --frozen mypy
        working-directory: backend

      - name: Test with coverage
        run: uv run --frozen pytest --cov=app --cov-report=term-missing --cov-report=markdown:"$GITHUB_STEP_SUMMARY"
        working-directory: backend

      - name: Export production dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
        working-directory: backend

      - name: Install Python audit tools
        run: python -m pip install --disable-pip-version-check pip-audit cvss

      - name: Audit production Python dependencies
        run: |
          if pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --format=json --output "$RUNNER_TEMP/pip-audit.json"; then
            audit_status=0
          else
            audit_status=$?
          fi
          python "$GITHUB_WORKSPACE/.github/scripts/audit_python.py" "$RUNNER_TEMP/pip-audit.json" "$audit_status" "$GITHUB_WORKSPACE/.github/audit-exceptions.json"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage -- --reporter=dot --coverage.reporter=text --coverage.reporter=json-summary

      - name: Add coverage to workflow summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const { total } = require("./coverage/coverage-summary.json"); console.log("| Metric | Covered | Total | Coverage |\n| --- | ---: | ---: | ---: |\n" + ["lines", "statements", "functions", "branches"].map((key) => `| ${key} | ${total[key].covered} | ${total[key].total} | ${total[key].pct}% |`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Audit production npm dependencies
        run: |
          if npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit.json"; then
            audit_status=0
          else
            audit_status=$?
          fi
          node ../.github/scripts/audit_npm.mjs "$RUNNER_TEMP/npm-audit.json" "$GITHUB_WORKSPACE/.github/audit-exceptions.json" "$audit_status"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: ${{ github.actor != 'dependabot[bot]' }}
        with:
          args: --log-opts=--all --redact --exit-code=1

  docker:
    name: docker
    needs:
      - backend
      - frontend
      - secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend smoke-test image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: morningcoach-backend:${{ github.sha }}
          load: true
          push: false

      - name: Scan backend image and create SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morningcoach-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Fail on fixed backend HIGH or CRITICAL vulnerabilities
        id: backend-vulnerability-gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morningcoach-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Upload backend scan results to GitHub Security
        if: always() && github.actor != 'dependabot[bot]' && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Build frontend smoke-test image without publishing
        if: always()
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: morningcoach-frontend:${{ github.sha }}
          load: true
          push: false

      - name: Scan frontend image and create SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morningcoach-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      - name: Fail on fixed frontend HIGH or CRITICAL vulnerabilities
        if: always()
        id: frontend-vulnerability-gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: morningcoach-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Upload frontend scan results to GitHub Security
        if: always() && github.actor != 'dependabot[bot]' && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Fail the Docker job if either image has a blocking vulnerability
        if: always()
        env:
          BACKEND_SCAN_OUTCOME: ${{ steps.backend-vulnerability-gate.outcome }}
          FRONTEND_SCAN_OUTCOME: ${{ steps.frontend-vulnerability-gate.outcome }}
        run: |
          if [ "$BACKEND_SCAN_OUTCOME" = "failure" ] || [ "$FRONTEND_SCAN_OUTCOME" = "failure" ]; then
            echo "A Docker image contains a fixed HIGH or CRITICAL vulnerability."
            exit 1
          fi
